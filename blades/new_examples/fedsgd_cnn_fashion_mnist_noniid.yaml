fedavg_blades:
  run: FEDAVG
  stop:
    training_iteration: 2000

  config:
    random_seed:
        grid_search: [122]
      # grid_search: [121, 122, 123, 124, 125]
    dataset_config:
      type: FashionMNIST
      num_clients: 100
      train_batch_size: 64
      partitioner_config:
        type: DirichletPartitioner
        alpha:
          grid_search: [0.1,0.5,0.8]
        num_clients: 100
      # partitioner_config:
      #   type: IIDPartitioner
      #   num_clients: 20

    evaluation_interval: 50

    num_remote_workers: 0
    num_gpus_per_worker: 0.3
    num_cpus_per_worker: 0
    num_cpus_for_driver: 3
    num_gpus_for_driver: 0.3

    global_model: cnn

    client_config:
        lr: 1.0
        momentum:
          grid_search: [0.0]

        # callbacks_config:
        #   type: blades.clients.callbacks.ClippingCallback
        #   clip_threshold:
        #     grid_search: [5.0]

    server_config:
      aggregator:
        grid_search: [
          type: Mean,
          type: Clippedclustering,
          # type: Median,
          type: GeoMed,
          type: DnC,
          # type: Trimmedmean,
          type: Signguard,
          type: Multikrum,
          type: Centeredclipping,
          # type: SpectralClusteringAggregator,
          # type: SpectralClusteringAggregator2,
          # type: MCA,
          # type: FedCut
          ]

      optimizer:
        type: SGD
        lr: 0.1
        lr_schedule: [[0, 0.1], [1500, 0.1], [1501, 0.01], [2000, 0.01]]
        momentum:
          grid_search: [0.0]

    num_malicious_clients:
      # grid_search:  [0,9]
      # grid_search:  [3, 6]
      grid_search:  [0]
      # grid_search: [1, 2, 3, 4, 5, 6]

    adversary_config:
      grid_search:
        - type: blades.adversaries.ALIEAdversary
        # - type: blades.adversaries.SPEARAdversary
        # - type: blades.adversaries.SPEARSLAdversary
        # - type: blades.adversaries.ScaleSignAdversary
        # - type: blades.adversaries.LabelFlipAdversary
        # - type: blades.adversaries.NoiseAdversary
        # - type: blades.adversaries.SignFlipAdversary
        # - type: blades.adversaries.IPMAdversary
        #   scale: 0.1
        # - type: blades.adversaries.IPMAdversary
        #   scale: 100
        # - type: blades.adversaries.MinMaxAdversary
        # - type: blades.adversaries.ByzMeanAdversary
